<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <style>
        /* Basic styling */
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; }
        .container { max-width: 500px; margin: 50px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="text"] { padding: 10px; width: 70%; }
        input[type="submit"] { padding: 10px 20px; }
        .weather-info { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Simple Weather App</h2>
        
        <form method="POST">
            <input type="text" name="city" placeholder="Enter a city name" required>
            <input type="submit" value="Get Weather">
        </form>

        {% if weather %}
            <div class="weather-info">
                
                {% if weather.error %}
                    <p style="color: red;">{{ weather.error }}</p>

                {% else %}
                    <h3>Weather in {{ weather.location }}</h3>
                    <p style="font-size: 48px; margin: 10px 0;">{{ weather.temp }}°C</p>
                    <p>{{ weather.condition }}</p>
                    <img src="https:{{ weather.icon }}" alt="Weather icon">
                {% endif %}
                
            </div>
        {% endif %}
    </div>
</body>
</html>
